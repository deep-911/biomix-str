name: BioMix-STR CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit & Verification Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies for Headless Mesh/VTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e biomix_str

      - name: Run Pytest Suite
        run: |
          echo "### Pytest Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          EXIT_CODE=0
          xvfb-run -a python -m pytest biomix_str/tests -m "not data_pending" --durations=10 -v --tb=short 2>&1 | tee -a $GITHUB_STEP_SUMMARY || EXIT_CODE=$?
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE
